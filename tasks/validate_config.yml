---
- name: Fail if required Ollama settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - ollama_uid
    - ollama_gid
    - ollama_container_network
    # An empty value here would put a bare `HOME=` into the environment file, leaving Ollama
    # without a writable home directory for its key pair and models.
    - ollama_environment_variables_home

- name: Fail if Ollama hardware acceleration is invalid
  ansible.builtin.fail:
    msg: >-
      ollama_hardware_acceleration must be 'cpu', 'cuda', or 'rocm'
  when: "ollama_hardware_acceleration not in ['cpu', 'cuda', 'rocm']"

- name: Run if Traefik is enabled
  when: ollama_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Ollama are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item.name }}`).
      when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
      with_items:
        - { "name": "ollama_container_labels_traefik_hostname", when: true }
        - { "name": "ollama_container_labels_traefik_path_prefix", when: true }
        - { "name": "ollama_container_labels_traefik_middleware_basic_auth_users", when: "{{ ollama_container_labels_traefik_middleware_basic_auth_enabled }}" }

    - name: Fail if ollama_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          ollama_container_labels_traefik_path_prefix (`{{ ollama_container_labels_traefik_path_prefix }}`) must be `/`.
          Ollama does not support hosting under a subpath yet.
      when: "ollama_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `ollama_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if ollama_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          ollama_container_labels_traefik_path_prefix (`{{ ollama_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/ollama`).
      when: "ollama_container_labels_traefik_path_prefix != '/' and ollama_container_labels_traefik_path_prefix[-1] == '/'"
