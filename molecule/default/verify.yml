---
- name: Verify Ollama
  hosts: all
  become: true
  gather_facts: false

  vars:
    ollama_molecule_api_base_url: "http://localhost:{{ ollama_molecule_http_bind_port }}"

    # Three sentences for the model to embed: two near-paraphrases and one about
    # something else entirely. An embedding model that works places the
    # paraphrases closer to each other than to the unrelated sentence, which a
    # runner that returned arbitrary numbers would only do by chance.
    ollama_molecule_inputs:
      - The cat sat on the mat.
      - A cat was sitting on the mat.
      - Interest rates rose sharply last quarter.

    ollama_verify_units:
      - ollama.service

  tasks:
    - name: Verify that Ollama works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: ollama_defaults

        - name: Wait for the Ollama systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: ollama_services
          until: ollama_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ ollama_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Ollama systemd services are active
          ansible.builtin.assert:
            that: ollama_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(ollama_verify_units | zip(ollama_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Ollama systemd services log for debugging
          when: ollama_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ ollama_verify_units }}"

        - name: Wait for Ollama to report its version (up to 5m)
          ansible.builtin.uri:
            url: "{{ ollama_molecule_api_base_url }}/api/version"
            method: GET
            follow_redirects: none
            status_code: [200, 404, 500, 502, 503]
            return_content: true
          register: ollama_api_version
          until: ollama_api_version.status == 200
          retries: 60
          delay: 5
          changed_when: false

        - name: Assert the running Ollama is the version this role installs
          ansible.builtin.assert:
            that:
              - ollama_api_version.json.version == ollama_defaults.ollama_version
            fail_msg: "Ollama reports {{ ollama_api_version.json.version | default('none') }}, expected {{ ollama_defaults.ollama_version }}"
            success_msg: "Ollama reports {{ ollama_api_version.json.version }}"

        # Ollama logs the configuration it parsed out of its environment when it
        # starts. Finding the scenario's keep-alive there, rather than Ollama's
        # own default, is what proves that the role's environment file reached
        # the process. The models directory shows that the home directory the
        # role sets is the one Ollama uses. Ollama reads OLLAMA_IGPU_ENABLE as a
        # string, so it has to arrive empty rather than as `false`.
        - name: Retrieve the Ollama systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=ollama.service
          register: ollama_startup_log
          changed_when: false

        - name: Find the configuration Ollama started with
          ansible.builtin.set_fact:
            ollama_server_config: "{{ ollama_startup_log.stdout_lines | select('search', 'msg=\"server config\"') | list | last | default('') }}"

        - name: Assert the role's environment reached the Ollama process
          ansible.builtin.assert:
            that:
              - "'OLLAMA_KEEP_ALIVE:' ~ ollama_molecule_keep_alive_logged ~ ' ' in ollama_server_config"
              - "'OLLAMA_MODELS:' ~ ollama_defaults.ollama_environment_variables_home ~ '/.ollama/models ' in ollama_server_config"
              - "'OLLAMA_HOST:http://0.0.0.0:' ~ ollama_container_http_port ~ ' ' in ollama_server_config"
              - "'OLLAMA_IGPU_ENABLE: ' in ollama_server_config"
            fail_msg: "Ollama started with {{ ollama_server_config | default('no logged configuration', true) }}"
            success_msg: >-
              Ollama runs with OLLAMA_KEEP_ALIVE={{ ollama_environment_variables_ollama_keep_alive }}
              and keeps its models in {{ ollama_defaults.ollama_environment_variables_home }}/.ollama/models

        # Everything above is Ollama answering about itself. Pulling a model is
        # the first probe that makes it write: it has to fetch the model from the
        # registry and store it in the data directory the role mounts, under the
        # read-only root filesystem and as a user other than root.
        - name: Pull a model into Ollama (up to 10m)
          ansible.builtin.uri:
            url: "{{ ollama_molecule_api_base_url }}/api/pull"
            method: POST
            follow_redirects: none
            body_format: json
            body:
              model: "{{ ollama_molecule_model }}"
              stream: false
            status_code: [200, 400, 404, 500, 502, 503]
            timeout: 600
            return_content: true
          register: ollama_pull
          until: ollama_pull.status == 200 and (ollama_pull.json.status | default('')) == 'success'
          retries: 3
          delay: 10
          changed_when: false

        - name: Assert Ollama pulled the model
          ansible.builtin.assert:
            that:
              - ollama_pull.status == 200
              - ollama_pull.json.status == 'success'
            fail_msg: "Pulling {{ ollama_molecule_model }} returned {{ ollama_pull.status }}: {{ ollama_pull.json | default(ollama_pull.content | default('')) }}"
            success_msg: "Pulling {{ ollama_molecule_model }} succeeded"

        # The documentation tells users to pull models with the CLI inside the
        # container, so the CLI has to find the server and see the same models.
        - name: List the models with the Ollama CLI inside the container
          ansible.builtin.command:
            cmd: "docker exec {{ ollama_defaults.ollama_identifier }} ollama list"
          register: ollama_cli_list
          changed_when: false

        - name: Assert the Ollama CLI lists the pulled model
          ansible.builtin.assert:
            that:
              - ollama_cli_list.stdout_lines | select('match', ollama_molecule_model ~ ':') | list | length == 1
            fail_msg: "`ollama list` printed {{ ollama_cli_list.stdout_lines }}"
            success_msg: "`ollama list` shows {{ ollama_molecule_model }}"

        - name: Check for the pulled model in the data directory
          ansible.builtin.find:
            paths: "/{{ ollama_defaults.ollama_identifier }}/data/models/blobs"
            file_type: file
          register: ollama_model_blobs

        - name: Assert the model was stored in the data directory
          ansible.builtin.assert:
            that:
              - ollama_model_blobs.matched > 0
              - ollama_model_blobs.files | map(attribute='uid') | unique | list == [ollama_uid]
            fail_msg: "Found {{ ollama_model_blobs.matched }} blobs owned by {{ ollama_model_blobs.files | map(attribute='uid') | unique | list }}"
            success_msg: "{{ ollama_model_blobs.matched }} blobs of the model are stored in the data directory, owned by {{ ollama_uid }}"

        # Running the model is what takes a request through a model runner, which
        # Ollama starts as a separate process. Embedding keeps that cheap.
        - name: Embed sentences with the model
          ansible.builtin.uri:
            url: "{{ ollama_molecule_api_base_url }}/api/embed"
            method: POST
            follow_redirects: none
            body_format: json
            body:
              model: "{{ ollama_molecule_model }}"
              input: "{{ ollama_molecule_inputs }}"
            status_code: [200, 400, 404, 500]
            timeout: 300
            return_content: true
          register: ollama_embed
          changed_when: false

        # The embeddings come back normalized, so their dot products are cosine
        # similarities.
        - name: Compute the similarities of the embeddings
          ansible.builtin.set_fact:
            ollama_similarity_paraphrase: >-
              {% set ns = namespace(sum=0) %}{% for a, b in ollama_embed.json.embeddings[0] | zip(ollama_embed.json.embeddings[1]) %}{% set ns.sum = ns.sum + a * b %}{% endfor %}{{ ns.sum }}
            ollama_similarity_unrelated: >-
              {% set ns = namespace(sum=0) %}{% for a, b in ollama_embed.json.embeddings[0] | zip(ollama_embed.json.embeddings[2]) %}{% set ns.sum = ns.sum + a * b %}{% endfor %}{{ ns.sum }}
          when: ollama_embed.status == 200

        - name: Assert the model produced meaningful embeddings
          ansible.builtin.assert:
            that:
              - ollama_embed.status == 200
              - ollama_embed.json.embeddings | length == ollama_molecule_inputs | length
              - ollama_embed.json.embeddings | map('length') | unique | list | length == 1
              - ollama_embed.json.embeddings[0] | length > 100
              - ollama_similarity_paraphrase | float > ollama_similarity_unrelated | float
            fail_msg: >-
              Embedding returned {{ ollama_embed.status }} with
              {{ ollama_embed.json.embeddings | default([]) | length }} embeddings
              (similarities: paraphrase {{ ollama_similarity_paraphrase | default('n/a') }},
              unrelated {{ ollama_similarity_unrelated | default('n/a') }})
            success_msg: >-
              Embedding returned {{ ollama_embed.json.embeddings | length }} vectors of
              {{ ollama_embed.json.embeddings[0] | length }} dimensions; the paraphrases are
              {{ ollama_similarity_paraphrase | float | round(3) }} similar, the unrelated sentence
              {{ ollama_similarity_unrelated | float | round(3) }}

        - name: Inspect the Ollama container
          ansible.builtin.command:
            cmd: "docker container inspect {{ ollama_defaults.ollama_identifier }}"
          register: ollama_container_raw
          changed_when: false

        - name: Assert the Ollama container runs with the role's hardening
          ansible.builtin.assert:
            that:
              - (ollama_container_raw.stdout | from_json | first).HostConfig.ReadonlyRootfs
              - (ollama_container_raw.stdout | from_json | first).HostConfig.CapDrop == ['ALL']
              - (ollama_container_raw.stdout | from_json | first).Config.User == (ollama_uid | string) + ':' + (ollama_gid | string)
            fail_msg: "The Ollama container does not run read-only, without capabilities, as {{ ollama_uid }}:{{ ollama_gid }}"
            success_msg: "The Ollama container runs read-only, without capabilities, as {{ ollama_uid }}:{{ ollama_gid }}"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "ollama_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: ollama_restarts_before
              loop: "{{ ollama_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: ollama_restarts_after
              loop: "{{ ollama_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - ollama_restarts_after.results | map(attribute='status.NRestarts') | list == ollama_restarts_before.results | map(attribute='status.NRestarts') | list
                  - ollama_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in ollama_verify_units | zip(ollama_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in ollama_verify_units | zip(ollama_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in ollama_verify_units | zip(ollama_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Ollama verification summary
          ansible.builtin.debug:
            msg:
              - "Ollama systemd: {% for unit, state in ollama_verify_units | zip(ollama_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Ollama restarts: {% for unit, restarts in ollama_verify_units | zip(ollama_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Ollama version: {{ ollama_api_version.json.version }}"
              - "Ollama model: {{ ollama_molecule_model }} ({{ ollama_model_blobs.matched }} blobs in the data directory)"
              - >-
                Ollama embeddings: {{ ollama_embed.json.embeddings | length }} vectors of
                {{ ollama_embed.json.embeddings[0] | length }} dimensions, paraphrase similarity
                {{ ollama_similarity_paraphrase | float | round(3) }} against {{ ollama_similarity_unrelated | float | round(3) }}

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Ollama systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=ollama.service
          register: ollama_service_log
          changed_when: false

        - name: Show the Ollama systemd service log
          ansible.builtin.debug:
            var: ollama_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Ollama verification failed. The systemd service log is printed above."
